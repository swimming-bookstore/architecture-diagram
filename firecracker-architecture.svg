<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Firecracker control plane architecture</title>
  <desc id="desc">A user reaches a control plane through a browser, a shell, and an agent. The control plane schedules Firecracker microVMs on worker hosts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="userCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="cpCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2a44"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="fcCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1d12"/>
      <stop offset="100%" stop-color="#2a160e"/>
    </linearGradient>
    <linearGradient id="vmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2416"/>
      <stop offset="100%" stop-color="#2c1a10"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="url(#bg)"/>

  <text x="64" y="52" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="28" font-weight="700">Firecracker control plane</text>
  <text x="64" y="80" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15">User surfaces drive a control plane that launches isolated Firecracker microVMs</text>

  <!-- User band -->
  <rect x="48" y="108" width="1184" height="168" rx="18" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="72" y="138" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">USER</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="88" y="156" width="320" height="92" rx="14" fill="url(#userCard)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <rect x="108" y="176" width="36" height="28" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="114" y="182" width="24" height="14" rx="2" fill="#0ea5e9" opacity="0.35"/>
  <text x="158" y="190" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="650">Browser</text>
  <text x="158" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13">Web UI · IDE · logs and consoles</text>

  <!-- Shell -->
  <g filter="url(#shadow)">
    <rect x="480" y="156" width="320" height="92" rx="14" fill="url(#userCard)" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <rect x="500" y="176" width="36" height="28" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.4"/>
  <text x="508" y="195" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">&gt;_</text>
  <text x="550" y="190" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="650">Shell</text>
  <text x="550" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13">CLI · SSH · interactive terminal</text>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="872" y="156" width="320" height="92" rx="14" fill="url(#userCard)" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <circle cx="518" cy="0" r="0"/>
  <circle cx="898" cy="190" r="14" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="898" cy="186" r="3" fill="#c4b5fd"/>
  <path d="M890 196 q8 6 16 0" fill="none" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="922" y="190" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="650">Agent</text>
  <text x="922" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13">Tool calls · API client · automations</text>

  <!-- Arrows user -> control plane -->
  <path d="M248 248 L248 292" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 248 L640 292" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1032 248 L1032 292" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="256" y="276" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11">HTTPS</text>
  <text x="648" y="276" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11">CLI / WS</text>
  <text x="1040" y="276" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="11">API</text>

  <!-- Control plane -->
  <rect x="48" y="300" width="1184" height="214" rx="18" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
  <text x="72" y="330" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">CONTROL PLANE</text>
  <text x="220" y="330" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">desired state, auth, placement, lifecycle</text>

  <g filter="url(#shadow)">
    <rect x="72" y="348" width="210" height="138" rx="12" fill="url(#cpCard)" stroke="#60a5fa" stroke-width="1.4"/>
  </g>
  <text x="90" y="378" fill="#93c5fd" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">API GATEWAY</text>
  <text x="90" y="404" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Auth &amp; sessions</text>
  <text x="90" y="426" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">REST / gRPC · tokens</text>
  <text x="90" y="446" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">rate limits · audit</text>
  <text x="90" y="466" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">browser, shell, agent</text>

  <g filter="url(#shadow)">
    <rect x="302" y="348" width="230" height="138" rx="12" fill="url(#cpCard)" stroke="#60a5fa" stroke-width="1.4"/>
  </g>
  <text x="320" y="378" fill="#93c5fd" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">ORCHESTRATOR</text>
  <text x="320" y="404" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">VM lifecycle</text>
  <text x="320" y="426" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">create · pause · snapshot</text>
  <text x="320" y="446" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">stop · resume · delete</text>
  <text x="320" y="466" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">reconcile desired state</text>

  <g filter="url(#shadow)">
    <rect x="552" y="348" width="210" height="138" rx="12" fill="url(#cpCard)" stroke="#60a5fa" stroke-width="1.4"/>
  </g>
  <text x="570" y="378" fill="#93c5fd" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">SCHEDULER</text>
  <text x="570" y="404" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Placement</text>
  <text x="570" y="426" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">host capacity · affinity</text>
  <text x="570" y="446" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">image &amp; kernel choice</text>
  <text x="570" y="466" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">quota per user</text>

  <g filter="url(#shadow)">
    <rect x="782" y="348" width="210" height="138" rx="12" fill="url(#cpCard)" stroke="#60a5fa" stroke-width="1.4"/>
  </g>
  <text x="800" y="378" fill="#93c5fd" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">DATA PLANE CTRL</text>
  <text x="800" y="404" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Attach &amp; proxy</text>
  <text x="800" y="426" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">vsock / serial console</text>
  <text x="800" y="446" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">port forward · TAP/net</text>
  <text x="800" y="466" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">metrics · logs stream</text>

  <g filter="url(#shadow)">
    <rect x="1012" y="348" width="196" height="138" rx="12" fill="url(#cpCard)" stroke="#60a5fa" stroke-width="1.4"/>
  </g>
  <text x="1030" y="378" fill="#93c5fd" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">CATALOG</text>
  <text x="1030" y="404" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Images &amp; state</text>
  <text x="1030" y="426" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">kernel + rootfs</text>
  <text x="1030" y="446" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">snapshots · secrets</text>
  <text x="1030" y="466" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">VM inventory</text>

  <!-- Arrow control plane -> hosts -->
  <path d="M640 514 L640 548" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="652" y="536" fill="#fbbf24" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">Firecracker API over Unix socket · per microVM</text>

  <!-- Worker / Firecracker -->
  <rect x="48" y="556" width="1184" height="248" rx="18" fill="#140e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="72" y="586" fill="#fdba74" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">WORKER HOSTS · FIRECRACKER</text>
  <text x="360" y="586" fill="#a8a29e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">KVM · one Firecracker process (and jailer) per microVM · virtio-net, virtio-block, vsock</text>

  <!-- Host box -->
  <rect x="72" y="604" width="1136" height="176" rx="14" fill="#1c1410" stroke="#78350f" stroke-width="1.2"/>
  <text x="90" y="628" fill="#fed7aa" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="650">Host · Linux + KVM</text>
  <text x="250" y="628" fill="#a8a29e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">jailer · cgroups · seccomp · API socket /run/firecracker.sock</text>

  <!-- three microVMs -->
  <g filter="url(#shadow)">
    <rect x="90" y="644" width="340" height="116" rx="12" fill="url(#vmCard)" stroke="#f59e0b" stroke-width="1.4"/>
  </g>
  <text x="108" y="670" fill="#fcd34d" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">microVM · browser session</text>
  <text x="108" y="694" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Guest kernel + rootfs</text>
  <text x="108" y="716" fill="#d6d3d1" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">dev server · desktop / code UI</text>
  <text x="108" y="736" fill="#a8a29e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">virtio-net · virtio-block · vsock</text>

  <g filter="url(#shadow)">
    <rect x="454" y="644" width="340" height="116" rx="12" fill="url(#vmCard)" stroke="#f59e0b" stroke-width="1.4"/>
  </g>
  <text x="472" y="670" fill="#fcd34d" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">microVM · shell session</text>
  <text x="472" y="694" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Guest kernel + rootfs</text>
  <text x="472" y="716" fill="#d6d3d1" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">login shell · build tools · pty</text>
  <text x="472" y="736" fill="#a8a29e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">serial console or SSH via TAP</text>

  <g filter="url(#shadow)">
    <rect x="818" y="644" width="366" height="116" rx="12" fill="url(#vmCard)" stroke="#f59e0b" stroke-width="1.4"/>
  </g>
  <text x="836" y="670" fill="#fcd34d" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700">microVM · agent sandbox</text>
  <text x="836" y="694" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="14">Guest kernel + rootfs</text>
  <text x="836" y="716" fill="#d6d3d1" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">repo, tools, and agent runtime</text>
  <text x="836" y="736" fill="#a8a29e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">isolated from host and other users</text>

  <text x="64" y="834" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">Each surface is a client of the control plane. Firecracker never faces the user directly — the control plane owns placement, the API socket, and session attach.</text>
</svg>
